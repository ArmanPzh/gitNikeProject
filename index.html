<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" type="image/png" href="/assets/images/logo.png" />

    <title>Home</title>
  </head>

  <body>
    <header>
      <nav></nav>
    </header>

    <section id="hero" class="position-relative w-100">
      <img src="/assets/images/hero.avif" alt="" class="d-block w-100" />

      <div
        class="hero-content position-absolute text-white d-flex flex-column gap-2"
      >
        <h2 class="display-4 fw-bold">
          EVERYTHING <br />
          LED HERE
        </h2>

        <p class="mb-0">
          Lock in for October baseball with fan gear built for prime time
        </p>

        <button class="btn btn-light rounded-5 mt-3">Shop MLB</button>
      </div>
    </section>

    <section id="shop" class="container pt-5 d-flex gap-2">
      <a href="#" class="text-decoration-none">
        <div class="card" style="width: 18rem">
          <img
            src="/assets/images/jerseys.avif"
            class="card-img-top"
            alt="shop jerseys"
          />
          <div class="card-body">
            <p class="card-text">Shop Jerseys</p>
          </div>
        </div>
      </a>

      <a href="#" class="text-decoration-none">
        <div class="card" style="width: 18rem">
          <img
            src="/assets/images/lifestyle.avif"
            class="card-img-top"
            alt="Shop Lifestyle"
          />
          <div class="card-body">
            <p class="card-text">Shop Lifestyle</p>
          </div>
        </div>
      </a>

      <a href="#" class="text-decoration-none">
        <div class="card" style="width: 18rem">
          <img
            src="/assets/images/braves.avif"
            class="card-img-top"
            alt="Shop Braves"
          />
          <div class="card-body">
            <p class="card-text">Shop Braves</p>
          </div>
        </div>
      </a>
    </section>

    <section id="oregon-ducks"></section>

    <footer></footer>
  </body>
</html>
